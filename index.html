<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B2E65">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GN Campo">
  <meta name="mobile-web-app-capable" content="yes">
  <title>GN Campo</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #0B2E65;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      padding-top: env(safe-area-inset-top);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      box-sizing: border-box;
      background: #0B2E65;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: linear-gradient(160deg, #061329 0%, #0B2E65 62%, #0754B8 100%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      transition: opacity .2s ease;
    }

    #loading strong {
      font-size: 28px;
      letter-spacing: -1px;
    }

    #loading span {
      font-size: 12px;
      opacity: .85;
    }

    #loading.oculto {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="loading">
    <strong>GN</strong>
    <span>Carregando sistema...</span>
  </div>

  <div id="app">
    <iframe
      id="gnframe"
      src="https://script.google.com/macros/s/AKfycbzt4w62yegUXU1A-SOAqpGlp1vV0TaHVZQZGvT9V-X0c2ZTEHbusI_KQ68_CdsDcnfQ/exec"
      title="GN Orçamentos Mobile"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

  <script>
    (function() {
      const frame = document.getElementById('gnframe');
      const loading = document.getElementById('loading');

      frame.addEventListener('load', function() {
        setTimeout(function() {
          loading.classList.add('oculto');
        }, 250);
      });

      document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
      }, { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(event) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });
    })();
  </script>
</body>
</html>
