<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B2E65">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GN Campo">
  <meta name="mobile-web-app-capable" content="yes">
  <title>GN Campo</title>
  <style>
    html,body{
      margin:0;width:100%;height:100%;overflow:hidden;background:#0B2E65;
      overscroll-behavior:none;-webkit-text-size-adjust:100%;
    }
    body{position:fixed;inset:0}
    #app{position:fixed;inset:0;width:100%;height:100%;background:#fff}
    iframe{display:block;width:100%;height:100%;border:0;margin:0;padding:0;background:#fff}
    #loading{
      position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
      flex-direction:column;gap:12px;background:linear-gradient(160deg,#061329,#0B2E65 62%,#0754B8);
      color:#fff;font-family:Arial,sans-serif;transition:opacity .2s ease
    }
    #loading strong{font-size:28px}
    #loading span{font-size:12px;opacity:.85}
    #loading.hide{opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <div id="loading"><strong>GN</strong><span>Carregando sistema...</span></div>
  <div id="app">
    <iframe id="gnframe" src="https://script.google.com/macros/s/AKfycbzt4w62yegUXU1A-SOAqpGlp1vV0TaHVZQZGvT9V-X0c2ZTEHbusI_KQ68_CdsDcnfQ/exec" title="GN Orçamentos Mobile"></iframe>
  </div>
  <script>
    const f=document.getElementById('gnframe');
    const l=document.getElementById('loading');
    f.addEventListener('load',()=>setTimeout(()=>l.classList.add('hide'),250));
    document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
  </script>
</body>
</html>
